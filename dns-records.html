  <main class="content" id="main">
    <div class="page-head">
      <div>
        <h1>DNS Records</h1>
        <p>All DNS records for <span id="pg-domain">example.com</span></p>
      </div>
      <button class="btn btn-ghost btn-sm" id="copy-all">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
        Copy All

    <form class="search-row" data-domain-form>
      <input class="input" type="text" data-domain-input aria-label="Domain">
      <button class="btn btn-primary" type="submit">Lookup</button>
    </form>

    <div class="chip-row" role="tablist" aria-label="Filter record types" id="chip-row">
      <span class="chip active" data-filter="ALL">All Records</span>
      <span class="chip" data-filter="A">A</span>
      <span class="chip" data-filter="AAAA">AAAA</span>
      <span class="chip" data-filter="CNAME">CNAME</span>
      <span class="chip" data-filter="MX">MX</span>
      <span class="chip" data-filter="TXT">TXT</span>
      <span class="chip" data-filter="NS">NS</span>
      <span class="chip" data-filter="SOA">SOA</span>
    </div>

    <div class="card table-wrap">
      <table class="dt-table">
        <thead>
          <tr><th>Type</th><th>Name</th><th>Value</th><th>TTL</th></tr>
        </thead>
        <tbody id="records-body">
          <tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:28px;">Looking up records…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  let currentRecords = [];

  function paintRows(filter) {
    const body = document.getElementById('records-body');
    const rows = filter === 'ALL' ? currentRecords : currentRecords.filter((r) => r.type === filter);
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:28px;">No records found.</td></tr>';
      return;
    }
    body.innerHTML = rows.map((r) => `
      <tr>
        <td><span class="rec-type">${r.type}</span></td>
        <td class="mono">${r.name}</td>
        <td class="mono">${r.data}</td>
        <td>${r.ttl}</td>
      </tr>`).join('');
  }

  document.getElementById('chip-row').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#chip-row .chip').forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    paintRows(chip.dataset.filter);
  });

  document.getElementById('copy-all').addEventListener('click', () => {
    const text = currentRecords.map((r) => `${r.type}\t${r.name}\t${r.data}\t${r.ttl}`).join('\n');
    navigator.clipboard && navigator.clipboard.writeText(text);
  });

  async function render(domain) {
    document.getElementById('pg-domain').textContent = domain;
    document.getElementById('records-body').innerHTML =
      '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:28px;">Looking up records…</td></tr>';
    document.querySelectorAll('#chip-row .chip').forEach((c) => c.classList.remove('active'));
    document.querySelector('#chip-row .chip[data-filter="ALL"]').classList.add('active');
    try {
      currentRecords = await DT.getAllRecords(domain);
      paintRows('ALL');
    } catch (e) {
      document.getElementById('records-body').innerHTML =
        `<tr><td colspan="4" style="text-align:center; color:var(--red); padding:28px;">Lookup failed: ${e.message}</td></tr>`;
    }
  }

  DT.initDomainForm(render);
</script>
